name = "commute-weather-planner-sync"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# Better Auth pulls in Node built-ins (crypto, buffer) for password hashing
# and token signing; without this flag the Worker fails to bundle.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "commute-weather-planner"
# From `wrangler d1 create commute-weather-planner` (region OC). Safe to
# commit — a database id is not a credential; access is controlled by the
# Cloudflare account the Worker is deployed under.
database_id = "7ef37d5d-a407-4a2a-aecf-7848a559726c"

# Object storage for gear photos (docs/03-data-models.md §3.3).
#
# Provisioned ahead of the feature that uses it: photo sync is NOT built
# yet. `photo_uri` is currently in DEVICE_LOCAL_COLUMNS
# (src/lib/sync/localChanges.ts), so photos stay on the device that took
# them and nothing reads or writes this bucket. The binding is declared so
# the plumbing is in place; adding the upload/download lifecycle is its own
# pass. See DECISIONS.md (2026-07-28, "Cloud sync excludes app_settings and
# gear photos").
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "commute-weather-planner-photos"

workers_dev = true

# Preview URLs are disabled deliberately. Enabled (the default), every
# deployed *version* also gets its own public hostname — which for this
# Worker means additional origins serving a live auth endpoint against the
# production database. There's no review workflow here that would use them,
# so they're all surface and no benefit.
preview_urls = false

[vars]
# The Worker's own public URL, used by Better Auth to construct callbacks.
# Must match the hostname clients actually reach, or sessions misbehave.
BETTER_AUTH_URL = "https://commute-weather-planner-sync.ant-jo-yuen.workers.dev"
# Origins allowed to call the API — the CORS allowlist in src/index.ts
# checks against exactly this list, with no wildcard, because the bearer
# token is the credential. localhost:8081 is the Expo web dev server (see
# .claude/launch.json); add any deployed web origin here too.
TRUSTED_ORIGINS = "http://localhost:8081,http://localhost:8787,https://commute-weather-planner-sync.ant-jo-yuen.workers.dev"

# BETTER_AUTH_SECRET is a secret, not a var — never commit it.
# Set it with:  wrangler secret put BETTER_AUTH_SECRET
