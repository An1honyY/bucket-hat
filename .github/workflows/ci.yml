name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest

  # docs/12-dev-workflow-ci.md §12.3 — the sync Worker (worker/) is its own
  # npm package with its own dependencies and tsconfig, so the app job above
  # never typechecks it. A separate job keeps a broken Worker from reaching
  # a deploy silently; it stays fast because there's no test suite here (the
  # Worker's behaviour is covered end-to-end from the client side in
  # src/lib/sync/syncEngine.test.ts).
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, not the app job's 20: wrangler, miniflare and kysely all
          # declare `engines.node >= 22`, and wrangler enforces it at runtime
          # rather than warning. That mismatch was invisible while this job
          # only typechecked — `npm ci` printed EBADENGINE warnings nobody
          # read — and became a failure the moment the dry-run step below
          # actually executed wrangler.
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # A dry-run deploy: bundles the Worker and reads the whole config
      # without touching Cloudflare (no credentials needed). It catches the
      # class of break that otherwise only shows up as a failed Workers Build
      # — an unresolvable import, a malformed binding, a key in the wrong
      # TOML table — while the last good deploy quietly stays live.
      #
      # `assets.directory` has to exist for wrangler to read the config at
      # all. worker/public is the gitignored output of the app's web build,
      # which this job deliberately doesn't run: it takes minutes and proves
      # nothing about the Worker. A placeholder satisfies the check.
      - run: mkdir -p public && touch public/index.html
      - run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry
