name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest

  # docs/12-dev-workflow-ci.md §12.3 — the sync Worker (worker/) is its own
  # npm package with its own dependencies and tsconfig, so the app job above
  # never typechecks it. A separate job keeps a broken Worker from reaching
  # a deploy silently; it stays fast because there's no test suite here (the
  # Worker's behaviour is covered end-to-end from the client side in
  # src/lib/sync/syncEngine.test.ts).
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
